[package]
name = "cajuterm"
version = "1.0.0"
description = "CajuTerm — Terminal Windows 10/11 com PowerShell (ConPTY) e personalização visual máxima"
authors = ["CajuTerm Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
notify = "6"
window-vibrancy = "0.5"
parking_lot = "0.12"
dirs = "5"
base64 = "0.22"
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
